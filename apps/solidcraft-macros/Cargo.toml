[package]
name = "solidcraft-macros"
description = "Example Rust macros for SolidCraft (solidcraft-macro-client)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "chamfer-large-holes"
path = "../../examples/macros/chamfer-large-holes.rs"

[[bin]]
name = "flatten-export-dxf"
path = "../../examples/macros/flatten-export-dxf.rs"

[[bin]]
name = "bolt-circle"
path = "../../examples/macros/bolt-circle.rs"

[[bin]]
name = "chamfer-selection"
path = "../../examples/macros/chamfer-selection.rs"

[[bin]]
name = "batch-mass"
path = "../../examples/macros/batch-mass.rs"

[[bin]]
name = "batch-export"
path = "../../examples/macros/batch-export.rs"

[[bin]]
name = "python-macro"
path = "../../examples/macros/python-macro.rs"

[dependencies]
rfd = { workspace = true }
serde_json = { workspace = true }
solidcraft-macro-client = { workspace = true }
